<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All-Time Draft night</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="night.css">
<link rel="stylesheet" href="draft.css">
<style>
/* your nine: five starters + a bench row */
.bench { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
.bench .b { display: flex; align-items: center; gap: 10px; padding: 6px 10px; min-height: 48px; border-radius: 3px; }
.bench .b.filled { background: var(--card); color: var(--cink); box-shadow: inset 4px 0 0 var(--team); }
.bench .b.filled img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: var(--cface); }
.bench .b.filled b { font: 700 16px/1.05 var(--cond); }
.bench .b.filled span { display: block; font: 500 11px var(--num); color: var(--cink2); }
.bench .b.empty { border: 1.5px dashed var(--rule3); color: var(--ink4); font: 700 14px var(--cond); letter-spacing: 0.06em; justify-content: center; }
.bench-label { margin-top: 12px; font: italic 500 13px Inter, sans-serif; color: var(--ink3); }

/* draft list extras */
.plist td.yrs { white-space: nowrap; }
.plist .yrs-btn { border: 0; border-bottom: 1px dashed var(--ink3); background: transparent; color: var(--ink2); font: 500 13px var(--num); padding: 0; cursor: pointer; }
.plist .yrs-btn small { color: var(--ink3); font: italic 500 12px Inter, sans-serif; margin-left: 4px; }
.plist .scout { font: italic 500 13px Inter, sans-serif; color: var(--ink2); text-decoration: underline; text-decoration-color: var(--ink4); text-underline-offset: 3px; }
.plist .star { color: var(--ink3); font-size: 16px; padding: 0 6px; }
.plist .star.on { color: var(--gold); }
.minirow { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--ink2); }
.minirow b { color: var(--ink); }
.minirow a { color: var(--ink2); font-style: italic; }
.bboard { margin: 0; padding: 0; list-style: none; counter-reset: bb; }
.bboard li { counter-increment: bb; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
.bboard li::before { content: counter(bb); font: 600 12px var(--num); color: var(--ink3); }
.bboard li span { color: var(--ink3); font: 600 12px var(--num); }
.bboard li.gone { color: var(--ink3); text-decoration: line-through; }

/* years */
.spans tr.peak td.tier { color: var(--ink); }
.spans tr.pick td { background: var(--surf); }
.spans tr.pick td:first-child { box-shadow: inset 3px 0 0 var(--ink); padding-left: 10px; }
.spans td.y { font: 700 20px var(--cond); white-space: nowrap; }
.spans td.y small { display: block; font: italic 500 12px Inter, sans-serif; color: var(--ink3); }
.who-head { display: flex; align-items: center; gap: 16px; }
.who-head img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: var(--surf2); border: 1.5px solid var(--ink); }

/* team + rotation */
.roster td.rd { width: 34px; font: 600 12px var(--num); color: var(--ink3); }
.roster td.sl { width: 46px; font: 700 14px var(--cond); color: var(--ink2); }
.roster td.sl.bn { color: var(--ink3); font-style: italic; font-family: Inter; font-weight: 500; font-size: 12px; }
.rot { width: 100%; border-collapse: collapse; }
.rot td { padding: 10px 10px 10px 0; border-bottom: 1px solid var(--rule); font-size: 14px; color: var(--ink2); vertical-align: middle; }
.rot td.pos { width: 40px; font: 800 18px var(--cond); color: var(--ink); }
.rot td.who { width: 270px; }
.rot td.who b { color: var(--ink); font: 700 18px var(--cond); }
.rot td.who em { font-size: 13px; color: var(--ink3); }
.rot .mins { display: flex; height: 22px; border: 1px solid var(--rule3); }
.rot .mins i { display: flex; align-items: center; justify-content: center; font: 600 11px var(--num); font-style: normal; color: var(--cink); background: var(--card); border-right: 1px solid var(--bg); }
.rot .mins i.b2 { background: #A9A395; }
.rot .mins i.b3 { background: #77736A; color: var(--ink); }
@media (max-width: 600px) { .plist.roster th:not(.c-hide) { display: table-cell; } }
.rot td.tot { width: 50px; text-align: right; font: 600 14px var(--num); color: var(--ink); }

/* desk */
.desk { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }
.desk article { padding: 4px 24px 10px; border-left: 1px solid var(--rule); }
.desk article:first-child { border-left: 0; padding-left: 0; }
.desk .by { display: flex; align-items: center; gap: 10px; }
.desk .by .mono { width: 34px; flex: none; font-style: normal; margin: 0; height: 34px; border-radius: 50%; border: 1.5px solid var(--ink2); display: grid; place-items: center; font: 700 13px var(--cond); color: var(--ink); }
.desk .by b { display: block; font: 700 18px/1.1 var(--cond); }
.desk .by div span { display: block; font: italic 500 12px Inter, sans-serif; color: var(--ink3); }
.desk .take { margin-top: 14px; font: 800 24px/1 var(--cond); text-transform: uppercase; }
.desk .take.yes { color: var(--green); }
.desk .take.no { color: var(--red); }
.desk p { margin: 8px 0 0; font-size: 16px; line-height: 1.5; color: var(--ink2); }
.desk p b { color: var(--ink); font-weight: 600; }
.host { padding: 10px 0 12px; border-bottom: 1px solid var(--rule); font-size: 16px; font-style: italic; color: var(--ink2); }
.host b { font-style: normal; color: var(--ink); }

/* season */
.stand2 { width: 100%; border-collapse: collapse; }
.stand2 th { text-align: right; font: 700 11px Inter, sans-serif; letter-spacing: 0.06em; color: var(--ink3); padding: 0 8px 6px 0; }
.stand2 th:nth-child(-n+3) { text-align: left; }
.stand2 td { padding: 8px 8px 8px 0; border-bottom: 1px solid var(--rule); text-align: right; font: 500 14px var(--num); color: var(--ink2); }
.stand2 td.rk { text-align: left; width: 30px; color: var(--ink3); }
.stand2 td.tmc { text-align: left; width: 40px; }
.stand2 td.nm { text-align: left; font: 700 18px var(--cond); color: var(--ink); }
.stand2 td.nm i { font: italic 500 12px Inter, sans-serif; color: var(--ink3); margin-left: 6px; }
.stand2 tr.you td { background: var(--surf); color: var(--ink); }
.stand2 tr.you td.rk { box-shadow: inset 3px 0 0 var(--you); padding-left: 8px; color: var(--you); }
.stand2 tr.cut td { border-bottom: 1.5px dashed var(--ink3); }
.cutnote { font: italic 500 12px Inter, sans-serif; color: var(--ink3); padding: 6px 0 0; }
.leaders { width: 100%; border-collapse: collapse; }
.leaders td { padding: 8px 8px 8px 0; border-bottom: 1px solid var(--rule); font-size: 14px; color: var(--ink2); }
.leaders td.k { font: 700 13px Inter, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink3); width: 90px; }
.leaders td b { color: var(--ink); font-weight: 600; }
.leaders td.v { text-align: right; font: 600 16px var(--num); color: var(--ink); }

.dboard9 th:first-child { width: 150px; }
.dboard9 td { font-size: 13px; padding-right: 6px; }
.dboard9 td .pk { display: block; font: 500 11px var(--num); color: var(--ink3); }
.dboard9 td.e .pk { color: var(--ink4); }
.dboard9 td.tn { font-size: 16px; }
@media (max-width: 600px) { .dboard9 { width: 1000px; } .dboard9 th:first-child { width: 52px; } .dboard9 .nk { display: none; } }
.bgrid h3 a { color: var(--ink2); }
.bg-row { display: grid; grid-template-columns: 34px repeat(16, minmax(0, 1fr)); gap: 4px; margin-bottom: 4px; }
.bg-head { margin-bottom: 6px; }
.bg-rl { font: 600 11px var(--num); color: var(--ink3); display: flex; flex-direction: column; justify-content: center; }
.bg-rl i { font-style: normal; color: var(--ink3); }
.bg-team { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; padding-bottom: 4px; }
.bg-team b { font: 700 12px var(--cond); color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.bg-team.you { box-shadow: inset 0 -2px 0 var(--you); }
.bg-team.you b { color: var(--ink); }
.bg-cell { height: 66px; border-radius: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 0; overflow: hidden; }
.bg-cell.filled { background: var(--card); color: var(--cink); }
.bg-cell.filled img, .bg-cell.filled .ini { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: var(--cface); display: grid; place-items: center; font: 700 11px var(--cond); font-style: normal; color: var(--cink2); }
.bg-cell.filled small { font: 700 11px Inter, sans-serif; color: var(--cink2); letter-spacing: 0.06em; }
.bg-cell.filled b { font: 700 13px/1 var(--cond); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; padding: 0 2px; }
.bg-cell.filled.you { box-shadow: 0 0 0 2px var(--you); }
.bg-cell.empty { border: 1px dashed var(--rule); font: 500 11px var(--num); color: var(--ink4); }
.bg-cell.empty.you { border-color: var(--ink3); color: var(--ink2); }
.bg-cell.clock { border: 2px solid var(--red); }
.bg-cell.clock small { font: 700 13px var(--cond); letter-spacing: 0.06em; line-height: 1; text-transform: uppercase; color: var(--red); text-align: center; }
.bg-cell.clock b { font: 800 16px var(--cond); color: var(--ink); }
@media (max-width: 600px) { .bgrid { overflow-x: auto; } .bg-row { width: 900px; } }
.ribbon h3 a { color: var(--ink2); }
.rb-row { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; }
.rb-cell { height: 84px; border-radius: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 0; overflow: hidden; }
.rb-cell .rb-n { font: 500 11px var(--num); color: var(--cink2); }
.rb-cell.filled { background: var(--card); color: var(--cink); }
.rb-cell.filled, .rb-cell.next { opacity: 0.75; }
.rb-cell.filled img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: var(--cface); }
.rb-cell.filled b { font: 700 14px/1 var(--cond); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.rb-cell.filled small { font: 700 11px Inter, sans-serif; color: var(--cink2); }
.rb-cell.clock { border: 2px solid var(--red); }
.rb-cell.clock .rb-n { color: var(--ink3); }
.rb-cell.clock b { font: 800 24px var(--cond); }
.rb-cell.clock small { font: 700 13px var(--cond); letter-spacing: 0.06em; line-height: 1; text-align: center; text-transform: uppercase; color: var(--red); }
.rb-cell.next { border: 1px dashed var(--rule); }
.rb-cell.next .rb-n { color: var(--ink3); }
.rb-cell.next small { font: 700 11px var(--cond); color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.drawer-dim { position: fixed; inset: 0; background: rgba(5, 6, 9, 0.72); z-index: 5; }
.drawer { position: fixed; left: 50%; top: 0; transform: translateX(-50%); width: min(1320px, 100%); z-index: 6; background: var(--bg); border-bottom: 5px double var(--rule2); padding: 18px 24px 24px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6); }
@media (max-width: 600px) { .rb-row { grid-template-columns: repeat(12, 84px); overflow-x: auto; } .drawer { overflow-x: auto; padding: 14px 16px; } }

/* playoffs bracket */
.bracket { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; align-items: center; }
.round h4 { margin: 0 0 10px; font: 700 14px var(--cond); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink3); border-bottom: 1px solid var(--rule); padding-bottom: 6px; }
.series { border-top: 1.5px solid var(--rule2); padding: 6px 0 4px; margin-bottom: 18px; }
.series .tr { display: grid; grid-template-columns: 22px 34px minmax(0, 1fr) 24px; gap: 8px; align-items: center; padding: 4px 0; font: 700 16px var(--cond); color: var(--ink3); }
.series .tr .sd { font: 500 12px var(--num); color: var(--ink3); }
.series .tr .w { font: 600 16px var(--num); text-align: right; }
.series .tr.win { color: var(--ink); }
.series .tr.win .w { color: var(--ink); }
.series .tr.you { color: var(--ink); }
.series .note { font: italic 500 12px Inter, sans-serif; color: var(--ink3); }
.series.you-path { border-top-color: var(--you); }
.series.live .note { color: var(--red); }
.round.final .series { border-top: 5px double var(--rule2); }
.round.final .series.live { border-top-color: var(--red); }

@media (max-width: 600px) {
  .bench { grid-template-columns: 1fr 1fr; gap: 6px; }
  .plist td.yrs, .plist th:nth-child(3), .plist td.sc2, .plist th:nth-child(7) { display: none; }
  .plist .mt i { display: none; }
  .bracket { grid-template-columns: 1fr; gap: 6px; }
  .desk { grid-template-columns: 1fr; }
  .desk article { border-left: 0; padding: 12px 0; border-top: 1px solid var(--rule); }
  .rot td.who { width: 118px; } .rot td.who em { display: none; } .rot td.who b { font-size: 16px; }
  .stand2 td:nth-child(n+6), .stand2 th:nth-child(n+6) { display: none; }
}

@media (max-width: 600px) { .capsbar { grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; } .cb-reset { display: none; } .cb-max em { display: none; } }
@media (max-width: 600px) { .ptabs { flex-wrap: wrap; } .ptabs .pt { padding: 8px 10px 10px; } .ptabs .pt b { font-size: 18px; } .ptabs .search { flex-basis: 100%; order: -1; margin: 0 0 6px; } }
.pt-more { display: flex; gap: 8px; align-items: baseline; margin: 0 0 10px 24px; font: 700 16px var(--cond); color: var(--ink); }
.pt-more > span { font: italic 500 13px Inter, sans-serif; color: var(--ink3); }
.pt-more u { text-decoration: none; border-bottom: 2px solid var(--ink); margin-right: 10px; }
@media (max-width: 600px) { .pt-more { display: none; } }

.acc-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--rule); font-size: 16px; color: var(--ink2); cursor: pointer; }
.acc-row i { font-style: normal; color: var(--ink3); }
.st-at td.car { text-align: right; color: var(--ink3); }
.st-at tr.open td { background: var(--surf); border-bottom: 1px solid var(--rule); text-align: left; font: 400 14px Inter, sans-serif; }
.edge { max-width: 620px; }
.eg > span:first-child { font: 700 14px var(--cond); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink2); }
.edge-key { font: italic 500 12px Inter, sans-serif; color: var(--ink3); }
.edge-key i { display: inline-block; width: 14px; height: 4px; vertical-align: 3px; margin: 0 4px 0 10px; }
.edge { padding: 8px 0 10px; display: grid; gap: 6px; }
.edge > b { font: 700 16px var(--cond); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink2); }
.eg { display: grid; grid-template-columns: 90px minmax(0, 1fr) 110px; gap: 12px; align-items: center; font-size: 13px; color: var(--ink2); }
.egb { position: relative; height: 10px; }
.egb i, .egb u { position: absolute; left: 0; height: 4px; }
.egb i { top: 0; background: var(--ink3); }
.egb u { top: 6px; background: var(--you); }
.eg .mono { font: 500 12px var(--num); color: var(--ink3); text-align: right; }
.five-row .card .sb b { color: var(--cink); }

.champ { border-top: 5px double var(--gold); border-bottom: 1.5px solid var(--gold); padding: 14px 0 12px; }
.champ .eb { font: 700 12px Inter, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); }
.champ h2 { margin: 4px 0 6px; font: 800 88px/0.9 var(--cond); text-transform: uppercase; color: var(--gold); }
.champ p { margin: 0; font-size: 16px; font-style: italic; color: var(--ink2); }
.champ p b { font-style: normal; color: var(--ink); }
.champ.out { border-color: var(--rule2); }
.champ.out .eb { color: var(--red); }
.champ.out h2 { color: var(--ink); font-size: 64px; }
.path-r { display: grid; grid-template-columns: 110px 34px 220px 60px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.pr-round { font: 700 14px var(--cond); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink3); }
.pr-opp { font: 700 18px var(--cond); }
.pr-score { font: 600 18px var(--num); }
.path-r.won .pr-score { color: var(--green); }
.path-r.lost .pr-score { color: var(--red); }
.pr-note { font: italic 500 14px Inter, sans-serif; color: var(--ink2); }
.sbox td:first-child { gap: 10px; }
.sbox td:first-child small { font: 700 11px Inter, sans-serif; color: var(--ink3); margin-left: 4px; }
.sb-f img, .sb-f .ini { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; background: var(--surf2); display: grid; place-items: center; font-size: 11px; }
.aw-list, .aw-grid { display: grid; gap: 0; }
.aw-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.aw { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.aw-f img, .aw-f .ini { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--surf2); }
.aw-t { display: block; font: 700 11px Inter, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold); }
.aw b { display: block; font: 700 18px/1.1 var(--cond); }
.aw small { display: block; font-size: 12px; color: var(--ink3); margin-top: 2px; }
.aw.big { flex-direction: column; align-items: flex-start; border-bottom: 0; border-top: 1.5px solid var(--rule2); padding-top: 12px; }
.aw.big .aw-f img { width: 72px; height: 72px; border: 1.5px solid var(--gold); }
.aw.big b { font-size: 24px; }
.allnba { display: grid; grid-template-columns: 130px repeat(5, minmax(0, 1fr)); gap: 10px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.an-l { font: 700 13px var(--cond); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink3); }
.an-p { font: 700 16px var(--cond); color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.an-p small { font: 700 11px Inter, sans-serif; color: var(--ink3); margin-left: 6px; }
.an-p.you { color: var(--you-ink); background: var(--you-bg); box-shadow: none; padding: 2px 6px; margin-left: -6px; border-radius: 3px; justify-self: start; max-width: calc(100% + 6px); }
.an-p.you small { color: var(--you-ink2); }
.ldr-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px 32px; }
.leaders tr.you td { color: var(--ink); }
.leaders tr.you td.k { color: var(--you); }
.share-card { max-width: 520px; background: var(--card); color: var(--cink); border-radius: 6px; overflow: hidden; }
.sc-top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--cink); color: var(--card); }
.sc-top .mark { border-color: var(--gold); }
.sc-top b { font: 800 20px var(--cond); letter-spacing: 0.06em; }
.sc-top > span:last-child { margin-left: auto; font: italic 500 12px Inter, sans-serif; color: #A9A395; }
.sc-main { display: flex; justify-content: space-between; align-items: center; padding: 18px 18px 8px; }
.sc-main h2 { margin: 4px 0; font: 800 48px/0.95 var(--cond); text-transform: uppercase; }
.sc-main p { margin: 0; font: 600 14px var(--num); color: var(--cink2); }
.sc-trophy { font-size: 48px; }
.sc-path { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1.5px solid var(--cink); border-bottom: 1px solid var(--cline); margin-top: 10px; }
.sc-path div { display: flex; align-items: center; gap: 8px; padding: 10px 14px; }
.sc-path div + div { border-left: 1px solid var(--cline); }
.sc-path span:first-child { font: 700 12px var(--cond); text-transform: uppercase; color: var(--cink2); }
.sc-path b { margin-left: auto; font: 700 16px var(--num); }
.sc-five { display: grid; grid-template-columns: repeat(5, 1fr); padding: 14px 10px 6px; text-align: center; }
.sc-five img, .sc-five .ini { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; background: var(--cface); border: 1.5px solid var(--cink); }
.sc-five b { display: block; font: 700 16px var(--cond); margin-top: 4px; }
.sc-five small { font: 500 11px var(--num); color: var(--cink2); }
.sc-aw { padding: 10px 16px 14px; font: italic 600 13px Inter, sans-serif; color: var(--cink2); text-align: center; border-top: 1px solid var(--cline); }
@media (max-width: 600px) {
  .champ h2 { font-size: 48px; }
  .path-r { grid-template-columns: 90px 34px minmax(0, 1fr) 46px; }
  .path-r .pr-note { grid-column: 1 / -1; }
  .aw-grid { grid-template-columns: 1fr 1fr; }
  .allnba { grid-template-columns: 1fr 1fr; }
  .an-l { grid-column: 1 / -1; }
  .ldr-grid { grid-template-columns: 1fr; }
  .sbox td:nth-child(n+7), .sbox th:nth-child(n+7) { display: none; }
}
.tsm .t b { font-size: 28px; white-space: nowrap; }
.sbox td:first-child { display: table-cell; white-space: nowrap; }
.sbox .sb-f { display: inline-block; vertical-align: middle; margin-right: 10px; }
.sbox th { text-transform: uppercase; }
.aw-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0 18px; }
.aw-row .aw { border-bottom: 0; }
.sbox th:first-child { width: 230px; }
@media (max-width: 600px) { .aw-row { grid-template-columns: 1fr 1fr; } }

@media (max-width: 600px) { .story-grid { grid-template-columns: 300px; } .poster { padding: 12px; } .po-head h2 { font-size: 34px; } .po-head p { font-size: 13px; } .po-ph { height: 62px; } .po-p b { font-size: 13px; } .po-p small { display: none; } .po-p em { font-size: 11px; white-space: nowrap; } .po-prof { gap: 6px; } .pp span { letter-spacing: 0.06em; } .po-strip b { font-size: 20px; } .po-strip span { letter-spacing: 0.06em; } }

}

/* in-season: progress, MVP race, best game, team records */
.sprog { height: 4px; background: var(--rule); margin-top: -12px; }
.sprog i { display: block; height: 100%; background: var(--ink2); }

.mvp-r .trd.up { color: var(--green); } .mvp-r .trd.down { color: var(--red); }
.gos { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; align-items: center; padding: 10px 0 12px; border-bottom: 1px solid var(--rule); }
.gos img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: var(--surf2); }
.gos b { display: block; font: 700 20px/1.1 var(--cond); color: var(--ink); }
.gos b em { font: 600 20px var(--num); font-style: normal; color: var(--ink); margin-left: 6px; }
.gos b em small { font: 500 12px Inter, sans-serif; color: var(--ink3); margin-left: 3px; }
.gos .ln { display: block; margin-top: 4px; font: 500 12px var(--num); color: var(--ink2); }
.gos .ctx { display: block; margin-top: 2px; font-size: 13px; font-style: italic; color: var(--ink3); }
@media (max-width: 600px) { .mvp-r { grid-template-columns: 18px 40px minmax(0, 1fr) auto; gap: 10px; padding: 10px 4px; } .mvp-r img { width: 40px; height: 40px; } }
.stack { display: flex; flex-direction: column; gap: 22px; min-width: 0; }

/* small windows: settings, how to play, leave; loading */
.dlg { position: fixed; z-index: 6; left: 50%; top: 60px; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); max-height: calc(100vh - 100px); overflow: auto; background: var(--bg); border-top: 5px double var(--rule2); padding: 18px 24px 24px; box-shadow: 0 24px 60px rgba(0, 0, 0, .6); }
.dlg.sm { width: min(440px, calc(100% - 32px)); top: 140px; }
.dlg-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1.5px solid var(--rule2); padding-bottom: 8px; margin-bottom: 6px; }
.dlg-head h2 { margin: 0; font: 800 34px/1 var(--cond); text-transform: uppercase; letter-spacing: 0.02em; }
.dlg-head a { color: var(--ink2); text-decoration: none; font-size: 18px; }
.dlg p.lead { margin: 10px 0 18px; font-size: 16px; line-height: 1.5; color: var(--ink2); }
.set-r { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.set-r > b { display: block; font: 700 16px var(--cond); text-transform: uppercase; letter-spacing: 0.06em; }
.set-opts { display: flex; gap: 22px; margin: 10px 0 8px; }

.load { grid-column: 1 / -1; width: 100%; max-width: 520px; margin: 0 auto; padding: 18vh 16px 0; }

@media (max-width: 600px) { .dlg { top: 24px; padding: 16px; } .dlg.sm { top: 120px; } .dlg-head h2 { font-size: 28px; } .load { padding-top: 14vh; } }
</style>

<body>
<div class="game" id="app"></div>
<script>
const T = {
  BOI: ['Boise', 'Mooses', '#1f4d3a', '#e9c46a'], KEN: ['Kentucky', 'Chickens', '#b8322a', '#fff4dc'], ANC: ['Anchorage', 'Walruses', '#2b5d7d', '#f3f7fa'],
  SFE: ['Santa Fe', 'Coyotes', '#a14a2c', '#f7d9a8'], DUL: ['Duluth', 'Yetis', '#3d4f66', '#e6f2ff'], TUL: ['Tulsa', 'Twisters', '#4b2a6b', '#d8c1f0'],
  REN: ['Reno', 'Jackrabbits', '#1c1c22', '#ff5a36'], DET: ['Detroit', 'Gearheads', '#39424e', '#f08a24'], SCR: ['Scranton', 'Moles', '#5a3d2b', '#e8c07a'],
  HON: ['Honolulu', 'Tiger Sharks', '#0f7c84', '#f4f1e4'], TPA: ['Tampa', 'Manatees', '#4a9a8f', '#ffffff'], LUB: ['Lubbock', 'Armadillos', '#d8a868', '#3a2a1c'],
  BIS: ['Bismarck', 'Narwhals', '#1b2f5e', '#a7e3e0'], ASP: ['Aspen', 'Ibexes', '#e9eef2', '#2a3f5a'], ELP: ['El Paso', 'Scorpions', '#d9661f', '#1d1d1d'],
  FRE: ['Fresno', 'Raisins', '#5e2750', '#f6b93b'],
};
const YOU = 'TUL';
const _lum = (h) => { const v = h.replace('#', ''); const x = (v.length === 3 ? v.split('').map((c) => c + c).join('') : v).match(/../g).map((c) => parseInt(c, 16) / 255).map((c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4)); return 0.2126 * x[0] + 0.7152 * x[1] + 0.0722 * x[2]; };
const _cr = (a, b) => { const [x, y] = [_lum(a), _lum(b)].sort((m, n) => n - m); return (x + 0.05) / (y + 0.05); };
// light franchise colour + light text → dark ink; dark backgrounds keep the franchise text colour
const tmInk = (bg, fg) => (_cr(bg, fg) < 4.5 && _cr(bg, '#1E1C18') > _cr(bg, '#FFFFFF') ? '#1E1C18' : fg);
const tm = (c) => `<span class="tm" style="background:${T[c][2]};color:${tmInk(T[c][2], T[c][3])}">${c}</span>`;
const tname = (c) => `${T[c][0]} ${T[c][1]}`;
const P = {
  durant: ['Kevin Durant', 'SF', '2012–14', 19, 'Greatest peak', [30.1, 7.6, 5.1], 5.1, 'Shot creator · Ball hawk', 'durant', 'OKC', '#007AC1', 92, 78, 'A', 'B+'],
  payton: ['Gary Payton', 'PG', '1996–98', 15, 'All-NBA', [20.4, 4.6, 8.1], 3.0, 'Floor general · On-ball defender', 'gary-payton', 'SEA', '#00653A', 81, 90, 'B', 'A'],
  garnett: ['Kevin Garnett', 'PF', '2002–04', 19.4, 'Greatest peak', [23.6, 13.7, 5.5], 0.7, 'Playmaking big · Mobile defender', 'kevin-garnett', 'MIN', '#0C2340', 86, 91, 'C', 'A'],
  dirk: ['Dirk Nowitzki', 'PF', '2004–06', 18, 'MVP', [25.9, 9.3, 2.7], 4.1, 'Stretch big', 'dirk-nowitzki', 'DAL', '#00538C'],
  ewing: ['Patrick Ewing', 'C', '1989–91', 22, 'All-NBA', [27.1, 10.9, 2.9], 0.1, 'Post scorer · Rim protector', 'patrick-ewing', 'NYK', '#006BB6'],
  rodman: ['Dennis Rodman', 'PF', '1991–93', 6.9, 'All-Star', [9.8, 18.3, 2.1], 0.6, 'Roll man · Rebounder', 'dennis-rodman', 'DET', '#C8102E', 58, 92, 'D', 'A'],
  klay: ['Klay Thompson', 'SG', '2015–17', 16.8, 'All-NBA', [22.2, 3.8, 2.2], 7.5, 'Movement shooter · Wing stopper', 'klay-thompson', 'GSW', '#1D428A', 84, 80, 'A+', 'A'],
  dray: ['Draymond Green', 'PF', '2015–17', 9.8, 'All-Star', [12.3, 8.9, 7.1], 3.4, 'Playmaking big · Switchable big', 'draymond-green', 'GSW', '#1D428A'],
  rallen: ['Ray Allen', 'SG', '2005–07', 17, 'All-NBA', [26.4, 4.5, 4.0], 7.8, 'Off-screen shooter', 'ray-allen', 'SEA', '#00653A'],
  bwallace: ['Ben Wallace', 'C', '2002–04', 6.0, 'All-Star', [7.1, 15.4, 1.8], 0.1, 'Roll man · Rim protector', 'ben-wallace', 'DET', '#C8102E', 50, 96, 'D', 'A'],
  gobert: ['Rudy Gobert', 'C', '2018–20', 9.1, 'All-Star', [15.4, 13.1, 1.8], 0, 'Roll man · Rim protector', 'rudy-gobert', 'UTA', '#002B5C'],
  korver: ['Kyle Korver', 'SG', '2014–16', 8.3, 'All-Star', [11.1, 3.6, 2.4], 5.6, 'Off-screen shooter', 'kyle-korver', 'ATL', '#C8102E', 74, 62, 'A+', 'B'],
  iggy: ['Andre Iguodala', 'SF', '2008–10', 12.4, 'All-Star', [17.4, 6.0, 5.5], 3.6, 'Playmaker · Wing stopper', 'andre-iguodala', 'PHI', '#006BB6', 72, 85, 'B', 'A'],
  horry: ['Robert Horry', 'PF', '1996–98', 7.8, 'Starter', [9.2, 5.9, 2.6], 3.8, 'Stretch big', 'robert-horry', 'LAL', '#552583', 64, 74, 'B', 'B'],
  conley: ['Mike Conley', 'PG', '2015–17', 13.8, 'All-Star', [17.9, 3.1, 5.9], 5.2, 'Floor general · On-ball defender', 'mike-conley', 'MEM', '#5D76A9'],
};
const p = (k) => { const a = P[k]; return { k, n: a[0], pos: a[1], y: a[2], f: a[3], tier: a[4], st: a[5], tpa: a[6], r: a[7], img: a[8], t: a[9], c: a[10], off: a[11], def: a[12], t3: a[13], dur: a[14] }; };
const ini = (n) => n.split(' ').map((w) => w[0]).join('').slice(0, 2);
const face = (x) => x.img ? `<img src="heads/${x.img}.png" alt="">` : `<span class="ini">${ini(x.n)}</span>`;
const short = (n) => { const w = n.split(' '); return `${w[0][0]}. ${w.slice(1).join(' ')}`; };
const SL = ['PG', 'SG', 'SF', 'PF', 'C'];
const mast = (title, sub) => `<div class="mast keep"><b>${title}</b><small>${sub}</small></div>`;
const tally = (you, mid, ai, { youK = 'Caps left', midK = 'Cap', aiK = 'Round' } = {}) => `<div class="tally keep"><div class="t"><span class="k">${youK}</span><b>${you}</b></div><div class="t mid"><span class="k">${midK}</span><b class="${midK === 'Cap' ? '' : 'plain'}">${mid}</b></div><div class="t ai"><span class="k">${aiK}</span><b>${ai}</b></div></div>`;
const capbar = (pct) => `<div class="capbar keep"><i style="width:${pct}%"></i></div>`;
const links = `<div class="links"><a href="#">← Menu</a><a href="#">How to play</a><a href="#">Settings</a></div>`;
const actions = (btn) => `<div class="actions">${btn}${links}</div>`;
// red eyebrow only when something is happening now; every other eyebrow is quiet
const prompt = (eb, h, line, ebCls = '') => `<div class="prompt"><span class="eb ${ebCls || (/^(On the clock|AI on the clock|Live)|tonight/.test(eb) ? 'now' : '')}">${eb}</span><h2>${h}</h2><p>${line}</p></div>`;

  <p class="empty-note" style="margin-top:10px">Allowed, but Rodman at 26 lowers your Rotation score. <a href="#" style="color:var(--ink2)">Suggest a rotation</a> · <a href="#" style="color:var(--ink2)">Reset</a></p></section>`]; };

// ---- share posters for every mode (v2: a number per player, the team profile, Post + Story) ----
const PROF = (vals, weak, best) => [['Talent', vals[0]], ['Offense', vals[1]], ['Defense', vals[2]], ['Spacing', vals[3]], ['Fit', vals[4]]].map(([l, v]) => ({ l, v, cls: l === weak ? 'lo' : l === best ? 'hi' : '' }));
const profileRow = (prof) => `<div class="po-prof">${prof.map(({ l, v, cls }) => `<div class="pp ${cls}"><span>${l}</span><b>${v}</b><i><u style="width:${v}%"></u></i></div>`).join('')}</div>`;
const PLAYERS = (five, nums) => five.map((k, i) => ({ x: p(k), n: nums[i] }));
function fiveCells(list, unit, hidden) {
  if (hidden) return ['PG', 'SG', 'SF', 'PF', 'C'].map((ps) => `<div class="po-p"><div class="po-ph pback"><span>?</span></div><b>${ps}</b><small>shown tomorrow</small></div>`).join('');
  return list.map(({ x, n }) => `<div class="po-p" style="--team:${x.c}"><div class="po-ph">${face(x)}</div><b>${x.n.split(' ').slice(-1)[0]}</b><small>${x.pos} · ${x.y}</small><em>${unit === 'caps' ? '<i class="capi"></i>' : ''}${n}${unit === 'ppg' ? ' ppg' : ''}</em></div>`).join('');
}
function poster(d) {
  const { mode, kick, head, line, five, nums, unit, bench, benchNums, strip, foot, champ, hidden, prof } = d;
  return `<div class="poster ${champ ? 'champ-p' : ''}"><div class="po-mast"><span>Draftverse Daily</span><b>Tuesday, October 21</b><span>${mode}</span></div>
  <div class="po-head"><span class="po-kick">${kick}</span><h2>${head}</h2><p>${line}</p></div>
  <div class="po-five">${fiveCells(PLAYERS(five, nums || []), unit, hidden)}</div>
  ${bench ? `<div class="po-bench"><span>Bench</span>${bench.map((k, i) => { const x = p(k); return `<b>${x.n.split(' ').slice(-1)[0]}<small>${unit === 'caps' ? '<i class="capi"></i>' + benchNums[i] : benchNums[i] + ' ppg'}</small></b>`; }).join('')}</div>` : ''}
  ${profileRow(prof)}
  <div class="po-strip">${strip.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('')}</div>
  <div class="po-foot"><span class="mark">D</span><span>${foot}</span></div></div>`;
}
function story(d) {
  const { mode, kick, head, line, five, nums, unit, bench, benchNums, strip, champ, hidden, prof, extra } = d, foot = d.storyFoot || d.foot;
  const rows = hidden ? ['PG', 'SG', 'SF', 'PF', 'C'].map((ps) => `<div class="st-r"><div class="st-f pback"><span>?</span></div><div class="st-n"><b>${ps}</b><small>shown tomorrow</small></div><em>—</em></div>`).join('')
    : PLAYERS(five, nums).map(({ x, n }) => `<div class="st-r" style="--team:${x.c}"><div class="st-f">${face(x)}</div><div class="st-n"><b>${x.n}</b><small>${x.pos} · ${x.y}</small></div><em>${unit === 'caps' ? '<i class="capi"></i>' : ''}${n}${unit === 'ppg' ? '<small> ppg</small>' : ''}</em></div>`).join('');
  return `<div class="story ${champ ? 'champ-p' : ''}"><div class="po-mast"><span>Draftverse Daily</span><b>Oct 21</b><span>${mode}</span></div>
  <div class="po-head"><span class="po-kick">${kick}</span><h2>${head}</h2><p>${line}</p></div>
  <div class="st-sec">Starting five</div><div class="st-rows">${rows}</div>
  ${bench ? `<div class="st-sec">Bench</div><div class="st-bench">${bench.map((k, i) => { const x = p(k); return `<div><b>${x.n.split(' ').slice(-1)[0]}</b><small>${unit === 'caps' ? '<i class="capi"></i>' + benchNums[i] : benchNums[i] + ' ppg'}</small></div>`; }).join('')}</div>` : ''}
  <div class="st-sec">Team profile</div>${profileRow(prof)}
  ${extra ? `<div class="st-sec">${extra[0]}</div><div class="st-extra">${extra[1]}</div>` : ''}
  <div class="po-strip">${strip.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('')}</div>
  <div class="po-foot"><span class="mark">D</span><span>${foot}</span></div></div>`;
}
const FIVE_AT = ['payton', 'klay', 'durant', 'garnett', 'bwallace'], BENCH_AT = ['rodman', 'korver', 'iggy', 'horry'];
const SHARES = [
  { mode: 'All-Time Draft', kick: 'Final standings · 3rd of 16', head: 'Tulsa builds a wall', line: 'Payton, Garnett and Wallace give the Twisters the best defense in the league.', five: FIVE_AT, nums: [15, 16.8, 19, 19.4, 6], unit: 'caps', bench: BENCH_AT, benchNums: [6.9, 8.3, 12.4, 7.8], prof: PROF([86, 84, 93, 71, 88], 'Spacing', 'Defense'), strip: [['Place', '3rd'], ['Rating', '87'], ['Best', '90'], ['Title odds', '18%']], foot: 'Beat my 87 on the same board · challenge 7Q4K' },
  { mode: 'All-Time · season', kick: 'The Finals · game 7 · 104–99', head: 'Champions', line: 'Tulsa wins it from the 3 seed. Durant drops 38 in game 7.', five: FIVE_AT, nums: [19.8, 20.4, 29.4, 21.2, 7.4], unit: 'ppg', bench: BENCH_AT, benchNums: [5.1, 7.9, 8.8, 4.6], prof: PROF([86, 84, 93, 71, 88], 'Spacing', 'Defense'), strip: [['Season', '52–30'], ['Seed', '3rd'], ['Playoffs', '16–6'], ['Finals MVP', 'Durant']], foot: 'QF 4–1 HON · SF 4–2 SFE · F 4–3 KEN', storyFoot: 'Run it back on the same board · challenge 7Q4K', champ: true,
    extra: ['Playoff run & awards', `<div class="ex-path">${[['QF', 'HON', '4–1'], ['SF', 'SFE', '4–2'], ['Finals', 'KEN', '4–3']].map(([r, c, sc]) => `<span><small>${r}</small>${tm(c)}<b>${sc}</b></span>`).join('')}</div><div class="ex-aw">Finals MVP <b>Durant</b> · DPOY <b>Wallace</b> · All-NBA 1st <b>Durant</b></div>`] },
  { mode: 'Mini Draft', kick: 'Final standings · 4th of 16', head: 'Gobert locks the paint', line: 'The best rim protection in the field. Spacing kept Tulsa out of the top three.', five: ['payton', 'rallen', 'iggy', 'garnett', 'gobert'], nums: [15, 17, 12.4, 19.4, 9.1], unit: 'caps', prof: PROF([85, 86, 83, 72, 85], 'Spacing', 'Offense'), strip: [['Place', '4th'], ['Score', '84'], ['Best', '89'], ['Caps', '69.6']], foot: 'Same 16 teams, your turn · challenge M2X9' },
  { mode: 'Draw Five · daily', kick: 'Game of the day · beat the ’92 Bulls 108–101', head: 'Playoff lock', line: 'Same number as the five biggest names. Durant 31, Jordan 34.', five: [], hidden: true, prof: PROF([82, 85, 86, 71, 84], 'Spacing', 'Defense'), strip: [['Your five', '84'], ['Fan vote', '84'], ['Best', '88'], ['Streak', '🔥 6']], foot: 'One board for everyone today · your five stays hidden till tomorrow' },
];
S.shareAll = () => ['', `<div class="share-grid">${SHARES.map(poster).join('')}</div>`];
S.shareStory = () => ['', `<div class="story-grid">${SHARES.map(story).join('')}</div>`];
const key = (location.hash || '#draft').slice(1);
const [a, m] = S[key]();
document.getElementById('app').innerHTML = a ? `<aside>${a}</aside><main>${m}</main>` : m;
</script>
