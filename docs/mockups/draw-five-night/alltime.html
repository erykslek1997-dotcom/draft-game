<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All-Time Draft night</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="night.css">
<link rel="stylesheet" href="mini.css">
<style>
/* your nine: five starters + a bench row */
.bench { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
.bench .b { display: flex; align-items: center; gap: 10px; padding: 6px 10px; min-height: 48px; border-radius: 3px; }
.bench .b.filled { background: var(--card); color: var(--cink); box-shadow: inset 4px 0 0 var(--team); }
.bench .b.filled img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #E2DBCB; }
.bench .b.filled b { font: 700 16px/1.05 var(--cond); }
.bench .b.filled span { display: block; font: 500 11px var(--num); color: var(--cink2); }
.bench .b.empty { border: 1.5px dashed #38383A; color: #45433F; font: 700 14px var(--cond); letter-spacing: 0.04em; justify-content: center; }
.bench-label { margin-top: 12px; font: italic 500 13px Inter, sans-serif; color: var(--ink3); }

/* draft list extras */
.plist td.yrs { white-space: nowrap; }
.plist .yrs-btn { border: 0; border-bottom: 1px dashed var(--ink3); background: transparent; color: var(--ink2); font: 500 13px var(--num); padding: 0; cursor: pointer; }
.plist .yrs-btn small { color: var(--ink3); font: italic 500 12px Inter, sans-serif; margin-left: 4px; }
.plist .scout { font: italic 500 13px Inter, sans-serif; color: var(--ink2); text-decoration: underline; text-decoration-color: #4A4844; text-underline-offset: 3px; }
.plist .star { color: var(--ink3); font-size: 16px; padding: 0 6px; }
.plist .star.on { color: var(--gold); }
.minirow { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--ink2); }
.minirow b { color: var(--ink); }
.minirow a { color: var(--ink2); font-style: italic; }
.bboard { margin: 0; padding: 0; list-style: none; counter-reset: bb; }
.bboard li { counter-increment: bb; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
.bboard li::before { content: counter(bb); font: 600 12px var(--num); color: var(--ink3); }
.bboard li span { color: var(--ink3); font: 600 12px var(--num); }
.bboard li.gone { color: var(--ink3); text-decoration: line-through; }

/* years */
.spans tr.peak td.tier { color: var(--ink); }
.spans tr.pick td { background: #121317; }
.spans tr.pick td:first-child { box-shadow: inset 3px 0 0 var(--red); padding-left: 10px; }
.spans td.y { font: 700 20px var(--cond); white-space: nowrap; }
.spans td.y small { display: block; font: italic 500 12px Inter, sans-serif; color: var(--ink3); }
.who-head { display: flex; align-items: center; gap: 16px; }
.who-head img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: #1D1E21; border: 1.5px solid var(--ink); }

/* team + rotation */
.roster td.rd { width: 34px; font: 600 12px var(--num); color: var(--ink3); }
.roster td.sl { width: 46px; font: 700 14px var(--cond); color: var(--ink2); }
.roster td.sl.bn { color: var(--ink3); font-style: italic; font-family: Inter; font-weight: 500; font-size: 12px; }
.rot { width: 100%; border-collapse: collapse; }
.rot td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--rule); font-size: 14px; color: var(--ink2); vertical-align: middle; }
.rot td.pos { width: 40px; font: 800 18px var(--cond); color: var(--ink); }
.rot td.who { width: 270px; }
.rot td.who b { color: var(--ink); font: 700 17px var(--cond); }
.rot td.who em { font-size: 13px; color: var(--ink3); }
.rot .mins { display: flex; height: 22px; border: 1px solid #38383A; }
.rot .mins i { display: flex; align-items: center; justify-content: center; font: 600 11px var(--num); font-style: normal; color: var(--cink); background: var(--card); border-right: 1px solid var(--bg); }
.rot .mins i.b2 { background: #A9A395; }
.rot .mins i.b3 { background: #77736A; color: var(--ink); }
.rot td.tot { width: 50px; text-align: right; font: 600 14px var(--num); color: var(--ink); }

/* desk */
.desk { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }
.desk article { padding: 4px 22px 10px; border-left: 1px solid var(--rule); }
.desk article:first-child { border-left: 0; padding-left: 0; }
.desk .by { display: flex; align-items: center; gap: 10px; }
.desk .by .mono { width: 34px; flex: none; font-style: normal; margin: 0; height: 34px; border-radius: 50%; border: 1.5px solid var(--ink2); display: grid; place-items: center; font: 700 13px var(--cond); color: var(--ink); }
.desk .by b { display: block; font: 700 18px/1.1 var(--cond); }
.desk .by div span { display: block; font: italic 500 12px Inter, sans-serif; color: var(--ink3); }
.desk .take { margin-top: 14px; font: 800 26px/1 var(--cond); text-transform: uppercase; }
.desk .take.yes { color: var(--ink); }
.desk .take.no { color: var(--red); }
.desk p { margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: var(--ink2); }
.desk p b { color: var(--ink); font-weight: 600; }
.host { padding: 10px 0 12px; border-bottom: 1px solid var(--rule); font-size: 16px; font-style: italic; color: var(--ink2); }
.host b { font-style: normal; color: var(--ink); }

/* season */
.stand2 { width: 100%; border-collapse: collapse; }
.stand2 th { text-align: right; font: 700 11px Inter, sans-serif; letter-spacing: 0.08em; color: var(--ink3); padding: 0 8px 6px 0; }
.stand2 th:nth-child(-n+3) { text-align: left; }
.stand2 td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--rule); text-align: right; font: 500 14px var(--num); color: var(--ink2); }
.stand2 td.rk { text-align: left; width: 30px; color: var(--ink3); }
.stand2 td.tmc { text-align: left; width: 40px; }
.stand2 td.nm { text-align: left; font: 700 17px var(--cond); color: var(--ink); }
.stand2 td.nm i { font: italic 500 12px Inter, sans-serif; color: var(--red); margin-left: 6px; }
.stand2 tr.you td { background: #121317; color: var(--ink); }
.stand2 tr.you td.rk { box-shadow: inset 3px 0 0 var(--red); padding-left: 8px; color: var(--red); }
.stand2 tr.cut td { border-bottom: 1.5px dashed var(--red); }
.cutnote { font: italic 500 12px Inter, sans-serif; color: var(--red); padding: 6px 0 0; }
.leaders { width: 100%; border-collapse: collapse; }
.leaders td { padding: 8px 8px 8px 0; border-bottom: 1px solid var(--rule); font-size: 14px; color: var(--ink2); }
.leaders td.k { font: 700 13px Inter, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3); width: 90px; }
.leaders td b { color: var(--ink); font-weight: 600; }
.leaders td.v { text-align: right; font: 600 15px var(--num); color: var(--ink); }

.dboard9 th:first-child { width: 150px; }
.dboard9 td { font-size: 13px; padding-right: 6px; }
.dboard9 td .pk { display: block; font: 500 10px var(--num); color: var(--ink3); }
.dboard9 td.e .pk { color: #3A3A3C; }
.dboard9 td.tn { font-size: 15px; }
@media (max-width: 600px) { .dboard9 { width: 1000px; } .dboard9 th:first-child { width: 52px; } .dboard9 .nk { display: none; } }
.bgrid h3 a { color: var(--ink2); }
.bg-row { display: grid; grid-template-columns: 34px repeat(16, minmax(0, 1fr)); gap: 4px; margin-bottom: 4px; }
.bg-head { margin-bottom: 6px; }
.bg-rl { font: 600 11px var(--num); color: var(--ink3); display: flex; flex-direction: column; justify-content: center; }
.bg-rl i { font-style: normal; color: var(--ink3); }
.bg-team { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; padding-bottom: 4px; }
.bg-team b { font: 700 12px var(--cond); color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.bg-team.you { box-shadow: inset 0 -2px 0 var(--red); }
.bg-team.you b { color: var(--ink); }
.bg-cell { height: 66px; border-radius: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 0; overflow: hidden; }
.bg-cell.filled { background: var(--card); color: var(--cink); }
.bg-cell.filled img, .bg-cell.filled .ini { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: #E2DBCB; display: grid; place-items: center; font: 700 11px var(--cond); font-style: normal; color: var(--cink2); }
.bg-cell.filled small { font: 700 9px Inter, sans-serif; color: var(--cink2); letter-spacing: 0.04em; }
.bg-cell.filled b { font: 700 13px/1 var(--cond); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; padding: 0 2px; }
.bg-cell.filled.you { box-shadow: 0 0 0 2px var(--gold); }
.bg-cell.empty { border: 1px dashed #2E2F33; font: 500 11px var(--num); color: #45433F; }
.bg-cell.empty.you { border-color: var(--ink3); color: var(--ink2); }
.bg-cell.clock { border: 2px solid var(--red); }
.bg-cell.clock small { font: 700 9px Inter, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: var(--red); text-align: center; }
.bg-cell.clock b { font: 800 16px var(--cond); color: var(--ink); }
@media (max-width: 600px) { .bgrid { overflow-x: auto; } .bg-row { width: 900px; } }
.ribbon h3 a { color: var(--ink2); }
.rb-row { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; }
.rb-cell { height: 84px; border-radius: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 0; overflow: hidden; }
.rb-cell .rb-n { font: 500 10px var(--num); color: var(--cink2); }
.rb-cell.filled { background: var(--card); color: var(--cink); }
.rb-cell.filled, .rb-cell.next { opacity: 0.75; }
.rb-cell.filled img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; background: #E2DBCB; }
.rb-cell.filled b { font: 700 14px/1 var(--cond); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.rb-cell.filled small { font: 700 9px Inter, sans-serif; color: var(--cink2); }
.rb-cell.clock { border: 2px solid var(--red); }
.rb-cell.clock .rb-n { color: var(--ink3); }
.rb-cell.clock b { font: 800 22px var(--cond); }
.rb-cell.clock small { font: 700 9px Inter, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; color: var(--red); }
.rb-cell.next { border: 1px dashed #2E2F33; }
.rb-cell.next .rb-n { color: var(--ink3); }
.rb-cell.next small { font: 700 11px var(--cond); color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.drawer-dim { position: fixed; inset: 0; background: rgba(5, 6, 9, 0.72); z-index: 5; }
.drawer { position: fixed; left: 50%; top: 0; transform: translateX(-50%); width: min(1320px, 100%); z-index: 6; background: var(--bg); border-bottom: 5px double var(--rule2); padding: 18px 24px 22px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6); }
@media (max-width: 600px) { .rb-row { grid-template-columns: repeat(12, 84px); overflow-x: auto; } .drawer { overflow-x: auto; padding: 14px 16px; } }

/* player list v2: fixed columns, one number per cell, more air */
.plist { table-layout: fixed; }
.plist th { padding: 10px 12px 8px 0; white-space: nowrap; }
.plist td { padding: 12px 12px 12px 0; }
.plist td.f { width: 52px; }
.plist td.f img, .plist td.f .ini { width: 40px; height: 40px; }
.plist .nm { font: 700 21px/1.05 var(--cond); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plist .mt { margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plist th.num, .plist td.num { text-align: right; }
.plist td.num { font: 500 15px var(--num); color: var(--ink2); }
.plist td.cap, .plist td.cap.num { font: 600 17px var(--num); color: var(--gold); white-space: nowrap; }
.plist td.c { text-align: center; }
.plist td.yrs .yrs-btn { font-size: 14px; }
.plist td.yrs .yrs-btn small { font-style: normal; margin-left: 6px; color: var(--ink3); }
.plist td.tier { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plist .draft { width: 100%; padding: 8px 0; }
@media (max-width: 600px) {
  .plist td { padding: 10px 8px 10px 0; }
  .plist .c-hide { display: none; }
  .plist .nm { font-size: 18px; }
  .plist .mt { white-space: normal; }
  .plist .mst { white-space: nowrap; }
  .plist col:last-child { width: 74px !important; }
  .plist col:nth-last-child(2), .plist col:nth-last-child(4) { width: 74px !important; }
  .plist td.cap { font-size: 15px; }
  .plist .draft { font-size: 12px; }
}
/* playoffs bracket */
.bracket { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px; align-items: center; }
.round h4 { margin: 0 0 10px; font: 700 14px var(--cond); text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink3); border-bottom: 1px solid var(--rule); padding-bottom: 6px; }
.series { border-top: 1.5px solid var(--rule2); padding: 6px 0 4px; margin-bottom: 18px; }
.series .tr { display: grid; grid-template-columns: 22px 34px minmax(0, 1fr) 24px; gap: 8px; align-items: center; padding: 4px 0; font: 700 16px var(--cond); color: var(--ink3); }
.series .tr .sd { font: 500 12px var(--num); color: var(--ink3); }
.series .tr .w { font: 600 16px var(--num); text-align: right; }
.series .tr.win { color: var(--ink); }
.series .tr.win .w { color: var(--ink); }
.series .tr.you { color: var(--ink); }
.series .note { font: italic 500 12px Inter, sans-serif; color: var(--ink3); }
.series.you-path { border-top-color: var(--red); }
.series.live .note { color: var(--red); }
.round.final .series { border-top: 5px double var(--rule2); }
.round.final .series.live { border-top-color: var(--red); }

@media (max-width: 600px) {
  .bench { grid-template-columns: 1fr 1fr; gap: 6px; }
  .plist td.yrs, .plist th:nth-child(3), .plist td.sc2, .plist th:nth-child(7) { display: none; }
  .plist .mt i { display: none; }
  .bracket { grid-template-columns: 1fr; gap: 6px; }
  .desk { grid-template-columns: 1fr; }
  .desk article { border-left: 0; padding: 12px 0; border-top: 1px solid var(--rule); }
  .rot td.who { width: auto; }
  .rot .mins { display: none; }
  .stand2 td:nth-child(n+6), .stand2 th:nth-child(n+6) { display: none; }
}

/* caps range bar */
.capsbar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 18px; padding: 14px 0 22px; border-bottom: 1.5px solid var(--rule2); }
.capsbar .cb-k { font: italic 500 13px Inter, sans-serif; color: var(--ink3); }
.cb-track { position: relative; height: 4px; background: var(--rule); border-radius: 2px; margin: 0 8px; }
.cb-range { position: absolute; top: 0; bottom: 0; background: var(--gold); border-radius: 2px; }
.cb-h { position: absolute; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 3px var(--bg); }
.cb-max { position: absolute; top: -8px; bottom: -8px; width: 2px; margin-left: -1px; background: var(--red); text-decoration: none; }
.cb-max em { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); white-space: nowrap; font: italic 500 11px Inter, sans-serif; color: var(--red); }
.cb-track s { position: absolute; top: 10px; transform: translateX(-50%); text-decoration: none; font: 500 10px var(--num); color: var(--ink3); }
.cb-v { font: 600 16px var(--num); color: var(--gold); white-space: nowrap; }
.cb-reset { font: italic 500 13px Inter, sans-serif; color: var(--ink2); }
.filters { border-bottom: 0; }
@media (max-width: 600px) { .capsbar { grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; } .cb-reset { display: none; } .cb-max em { display: none; } }
/* position tabs */
.ptabs { display: flex; align-items: flex-end; gap: 0; border-bottom: 1.5px solid var(--rule2); }
.ptabs .pt { display: flex; align-items: baseline; gap: 6px; padding: 8px 16px 10px; text-decoration: none; color: var(--ink3); border-bottom: 3px solid transparent; margin-bottom: -1.5px; }
.ptabs .pt b { font: 800 20px var(--cond); letter-spacing: 0.03em; }
.ptabs .pt span { font: 500 12px var(--num); }
.ptabs .pt.need b { color: var(--ink); }
.ptabs .pt.have { opacity: 0.5; }
.ptabs .pt.have span { font: italic 500 12px Inter, sans-serif; }
.ptabs .pt.on { border-bottom-color: var(--red); }
.ptabs .pt.on b { color: var(--red); }
.ptabs .pt.on span { color: var(--ink2); }
.ptabs .search { border: 0; border-bottom: 1px solid #45433F; background: transparent; color: var(--ink); padding: 6px 0; font: 15px Inter, sans-serif; margin-left: auto; margin-bottom: 8px; flex: 0 1 260px; }
.slot.empty.sel { border: 2px solid var(--red); color: var(--red); background: rgba(224, 82, 90, 0.05); }
.slot.empty.sel small { color: var(--red); font-style: normal; font-weight: 600; }
@media (max-width: 600px) { .ptabs { flex-wrap: wrap; } .ptabs .pt { padding: 8px 10px 10px; } .ptabs .pt b { font-size: 17px; } .ptabs .search { flex-basis: 100%; order: -1; margin: 0 0 6px; } }
.ptabs .search::placeholder { color: var(--ink3); font-style: italic; }
.pt-more { display: flex; gap: 8px; align-items: baseline; margin: 0 0 10px 22px; font: 700 15px var(--cond); color: var(--ink); }
.pt-more > span { font: italic 500 13px Inter, sans-serif; color: var(--ink3); }
.pt-more u { text-decoration: none; border-bottom: 2px solid var(--ink); margin-right: 10px; }
@media (max-width: 600px) { .pt-more { display: none; } }

.acc-row { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--rule); font-size: 15px; color: var(--ink2); cursor: pointer; }
.acc-row i { font-style: normal; color: var(--ink3); }
.st-at td.car { text-align: right; color: var(--ink3); }
.st-at tr.open td { background: #121317; border-bottom: 1px solid var(--rule); text-align: left; font: 400 14px Inter, sans-serif; }
.edge { max-width: 620px; }
.eg > span:first-child { font: 700 14px var(--cond); text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink2); }
.edge-key { font: italic 500 12px Inter, sans-serif; color: var(--ink3); }
.edge-key i { display: inline-block; width: 14px; height: 4px; vertical-align: 3px; margin: 0 4px 0 10px; }
.edge { padding: 8px 0 10px; display: grid; gap: 6px; }
.edge > b { font: 700 15px var(--cond); text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink2); }
.eg { display: grid; grid-template-columns: 90px minmax(0, 1fr) 110px; gap: 12px; align-items: center; font-size: 13px; color: var(--ink2); }
.egb { position: relative; height: 10px; }
.egb i, .egb u { position: absolute; left: 0; height: 4px; }
.egb i { top: 0; background: var(--ink2); }
.egb u { top: 6px; background: var(--red); }
.eg .mono { font: 500 12px var(--num); color: var(--ink3); text-align: right; }
.five-row .card .sb b { color: var(--cink); }

.champ { border-top: 5px double var(--gold); border-bottom: 1.5px solid var(--gold); padding: 14px 0 12px; }
.champ .eb { font: 700 12px Inter, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); }
.champ h2 { margin: 4px 0 6px; font: 800 76px/0.9 var(--cond); text-transform: uppercase; color: var(--gold); }
.champ p { margin: 0; font-size: 16px; font-style: italic; color: var(--ink2); }
.champ p b { font-style: normal; color: var(--ink); }
.champ.out { border-color: var(--rule2); }
.champ.out .eb { color: var(--red); }
.champ.out h2 { color: var(--ink); font-size: 60px; }
.path-r { display: grid; grid-template-columns: 110px 34px 220px 60px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.pr-round { font: 700 14px var(--cond); text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink3); }
.pr-opp { font: 700 18px var(--cond); }
.pr-score { font: 600 18px var(--num); }
.path-r.won .pr-score { color: var(--gold); }
.path-r.lost .pr-score { color: var(--red); }
.pr-note { font: italic 500 14px Inter, sans-serif; color: var(--ink2); }
.sbox td:first-child { gap: 10px; }
.sbox td:first-child small { font: 700 11px Inter, sans-serif; color: var(--ink3); margin-left: 4px; }
.sb-f img, .sb-f .ini { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; background: #1D1E21; display: grid; place-items: center; font-size: 11px; }
.aw-list, .aw-grid { display: grid; gap: 0; }
.aw-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.aw { display: flex; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--rule); }
.aw-f img, .aw-f .ini { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #1D1E21; }
.aw-t { display: block; font: 700 11px Inter, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); }
.aw b { display: block; font: 700 18px/1.1 var(--cond); }
.aw small { display: block; font-size: 12px; color: var(--ink3); margin-top: 2px; }
.aw.big { flex-direction: column; align-items: flex-start; border-bottom: 0; border-top: 1.5px solid var(--rule2); padding-top: 12px; }
.aw.big .aw-f img { width: 72px; height: 72px; border: 1.5px solid var(--gold); }
.aw.big b { font-size: 24px; }
