<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reel B3 phase 2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=VT323&amp;family=JetBrains+Mono:wght@700&amp;display=swap">
<style>body{margin:0}a{color:#F2C14E}</style>
</helmet>
<div style="width: 540px; height: 960px; box-sizing: border-box; background: #1C1420; border: 6px solid #F2C14E; outline: 4px solid #0F0A12; outline-offset: -14px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: VT323, monospace; color: #F1E6D2; position: relative">
  <div style="font-family: 'Press Start 2P', monospace; font-size: 22px; color: #F2C14E; text-shadow: 3px 3px 0 #0F0A12">PEAK '89-'91</div>
  <div style="margin-top: 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 440px">
    <div style="height: 64px; background: #2A1E33; border: 3px solid #0F0A12; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-family: 'JetBrains Mono', monospace; font-size: 24px">18.8</span><span style="font-family: 'Press Start 2P', monospace; font-size: 8px; color: #B8A88F">PTS</span></div>
    <div style="height: 64px; background: #2A1E33; border: 3px solid #0F0A12; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-family: 'JetBrains Mono', monospace; font-size: 24px">7.3</span><span style="font-family: 'Press Start 2P', monospace; font-size: 8px; color: #B8A88F">AST</span></div>
    <div style="height: 64px; background: #2A1E33; border: 3px solid #0F0A12; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-family: 'JetBrains Mono', monospace; font-size: 24px">2.1</span><span style="font-family: 'Press Start 2P', monospace; font-size: 8px; color: #B8A88F">STL</span></div>
    <div style="height: 64px; background: #2A1E33; border: 3px solid #F2C14E; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-family: &quot;JetBrains Mono&quot;, monospace; font-size: 24px; color: rgb(242, 193, 78)">2x</span><span style="font-family: &quot;Press Start 2P&quot;, monospace; font-size: 8px; color: rgb(242, 193, 78)">ALL-DEF</span></div>
  </div>

  <div style="margin-top: 26px; width: 440px; font-family: 'Press Start 2P', monospace; font-size: 10px; color: #B8A88F">BOX PLUS-MINUS</div>
  <div style="margin-top: 10px; width: 440px; height: 360px; position: relative; border-bottom: 3px solid #F1E6D2">
    <div style="position: absolute; left: 0; right: 0; bottom: 115px; border-top: 2px dashed rgba(241,230,210,0.5)"></div>
    <div style="position: absolute; left: 0; bottom: 121px; font-size: 16px; color: #B8A88F">ALL-STAR LEVEL +2</div>
    <div style="position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 6px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="7">
        <div style="width: 48px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; color: {{b.c}}; margin-bottom: 6px">{{b.v}}</span>
          <div style="width: 48px; height: {{b.h}}; background: {{b.c}}; border: 3px solid #0F0A12; box-sizing: border-box"></div>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="margin-top: 8px; width: 440px; display: flex; justify-content: space-between; padding: 0 6px; box-sizing: border-box">
    <sc-for list="{{bars}}" as="b" hint-placeholder-count="7"><span style="width: 48px; text-align: center; font-size: 18px; color: #B8A88F">{{b.y}}</span></sc-for>
  </div>
  <div style="margin-top: 26px; background: #2A1E33; border: 3px solid #0F0A12; padding: 10px 18px; font-size: 26px">seven straight seasons above plus two.</div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: repeating-linear-gradient(45deg, rgba(192,96,58,0.10) 0 10px, transparent 10px 20px); border-top: 2px dashed rgba(192,96,58,0.5); display: flex; align-items: center; justify-content: center; font-size: 18px; color: #C0603A">platform UI zone (keep free)</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":540,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    var d = [['85', 2.2], ['86', 3.3], ['87', 5.2], ['88', 3.3], ['89', 3.2], ['90', 4.6], ['91', 3.0]];
    return { bars: d.map(function (x) {
      return { y: "'" + x[0], v: '+' + x[1].toFixed(1), h: Math.round(x[1] * 57.5) + 'px', c: x[1] === 5.2 ? '#F2C14E' : '#7FA35A' };
    }) };
  }
}
</script>
</body>
</html>
